<header class="topbar">
  <a class="brand" routerLink="/" aria-label="Imóveis, início">
    <span class="brand-mark" aria-hidden="true">I</span>
    <span>imóveis<span class="brand-dot">.</span></span>
  </a>
  <nav class="navigation" aria-label="Navegação principal">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Vitrine</a>
    @if (auth.isAuthenticated()) {
      @if (auth.role() === 'ADMIN') {
        <a routerLink="/admin" routerLinkActive="active">Painel admin</a>
      } @else {
        <a routerLink="/cliente" routerLinkActive="active">Área do cliente</a>
      }
      <span class="user-email">{{ auth.email() }}</span>
      <button class="link-button" type="button" (click)="sair()">Sair</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Entrar</a>
    }
  </nav>
</header>

<main class="app-main">
  <router-outlet />
</main>
<footer>Imóveis · Vitrine e área do cliente</footer>
